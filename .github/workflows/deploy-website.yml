name: 🌐 Deploy Website - The Digital Shrine

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'DOCS/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🎬 Begin Deployment Ritual
        run: |
          echo "🌐 ArtBastard DMX512 - Website Deployment"
          echo "═══════════════════════════════════════"
          echo "Preparing the digital shrine..."
          echo ""
      
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 🔗 Update GitHub Links
        run: |
          echo "🔗 Updating GitHub repository links..."
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -f "website/index.html" ]; then
            sed -i "s/yourusername/$REPO_OWNER/g" website/index.html website/script.js || true
            sed -i "s/ArtBastard-DMX512/$REPO_NAME/g" website/index.html website/script.js || true
            echo "✅ Links updated: $REPO_OWNER/$REPO_NAME"
          fi
          echo ""
          echo "📁 Website files:"
          ls -la website/ || true

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: ✅ Deployment Complete
        run: |
          echo ""
          echo "✅ Website deployed successfully!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "═══════════════════════════════════════"


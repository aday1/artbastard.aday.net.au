name: artbastard-image

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      track:
        description: "Deploy track (test|live|aday)"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine track
        id: track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TRACK="live"
          else
            TRACK="test"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/artbastard:${{ steps.track.outputs.track }}
            ghcr.io/${{ github.repository }}/artbastard:${{ steps.track.outputs.track }}-${{ github.sha }}

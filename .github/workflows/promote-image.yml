name: promote-image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing image tag to promote (e.g. test-<sha>)"
        required: true
      target_track:
        description: "Target track tag (live|aday)"
        required: true
        default: "live"

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote by retagging
        run: |
          SRC="ghcr.io/${{ github.repository }}/artbastard:${{ github.event.inputs.source_tag }}"
          DST="ghcr.io/${{ github.repository }}/artbastard:${{ github.event.inputs.target_track }}"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
